name: Build Chrome extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install test browser
        run: npx playwright install --with-deps --no-shell chromium
      - name: Build and test
        run: npm test
      - name: Package and verify the extension
        run: |
          node scripts/package.mjs
          unzip -t dist/ConfluenceToolkit.zip
      - name: Upload Chrome extension ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ConfluenceToolkit
          path: dist/ConfluenceToolkit.zip
          if-no-files-found: error
